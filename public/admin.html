<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>StrangerChat Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
}

.logout {
    background: #334155;
    color: white;
}

.login-box {
    max-width: 400px;
    margin: 100px auto;
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
}

.login-box h2 {
    text-align: center;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
}

.login-btn {
    width: 100%;
    background: #22c55e;
    color: white;
    margin-top: 10px;
}

.error {
    color: #f87171;
    text-align: center;
    margin-top: 10px;
}

.dashboard {
    display: none;
}

.cards {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 15px;
}

.card-title {
    color: #94a3b8;
    font-size: 14px;
}

.card-value {
    font-size: 32px;
    font-weight: bold;
    margin-top: 8px;
}

.status {
    color: #4ade80;
}

.users-box {
    background: #1e293b;
    border-radius: 15px;
    padding: 20px;
    overflow-x: auto;
}

.users-box h2 {
    margin-top: 0;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}

th,
td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #334155;
}

th {
    color: #94a3b8;
}

.waiting {
    color: #facc15;
}

.chatting {
    color: #4ade80;
}

.online {
    color: #60a5fa;
}

.disconnect {
    background: #ef4444;
    color: white;
}

.disconnect:hover {
    background: #dc2626;
}

.no-users {
    text-align: center;
    color: #94a3b8;
    padding: 25px;
}

</style>

</head>


<body>


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div id="loginScreen"
     class="login-box">

    <h2>🛡️ StrangerChat Admin</h2>

    <input
        id="username"
        type="text"
        placeholder="Username">

    <input
        id="password"
        type="password"
        placeholder="Password">

    <button
        class="login-btn"
        onclick="login()">

        Login

    </button>

    <div id="loginError"
         class="error">
    </div>

</div>



<!-- ========================= -->
<!-- DASHBOARD -->
<!-- ========================= -->

<div id="dashboard"
     class="dashboard">

<div class="container">


<div class="header">

    <h1>🛡️ StrangerChat Admin</h1>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</div>



<!-- ========================= -->
<!-- STAT CARDS -->
<!-- ========================= -->

<div class="cards">


<div class="card">

    <div class="card-title">
        👥 Online Users
    </div>

    <div id="onlineUsers"
         class="card-value">

        0

    </div>

</div>


<div class="card">

    <div class="card-title">
        🟡 Waiting Users
    </div>

    <div id="waitingUsers"
         class="card-value">

        0

    </div>

</div>


<div class="card">

    <div class="card-title">
        💬 Active Chats
    </div>

    <div id="activeChats"
         class="card-value">

        0

    </div>

</div>


<div class="card">

    <div class="card-title">
        Server
    </div>

    <div class="card-value status">
        ● Online
    </div>

</div>


</div>



<!-- ========================= -->
<!-- LIVE USERS -->
<!-- ========================= -->

<div class="users-box">

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">

    <h2 style="margin:0;">👥 Live Users</h2>

    <button
        onclick="loadStats()"
        style="background:#2563eb; color:white;">
        🔄 Refresh
    </button>

</div>

<table>

<thead>

<tr>

<th>Nickname</th>
<th>Status</th>
<th>Connected</th>
<th>Disconnect</th>

</tr>

</thead>


<tbody id="usersTable">

<tr>

<td colspan="4"
    class="no-users">

    No users connected

</td>

</tr>

</tbody>

</table>

</div>


</div>

</div>



<script>

const ADMIN_PATH =
    "/Ax3chu-panel-7x9k";


// =========================
// LOGIN
// =========================

async function login() {

    const username =
        document.getElementById(
            "username"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;


    const response =
        await fetch(
            ADMIN_PATH + "/login",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })

            }
        );


    const data =
        await response.json();


    if (data.success) {

        showDashboard();

    }

    else {

        document.getElementById(
            "loginError"
        ).textContent =
            data.message ||
            "Login failed";

    }

}



// =========================
// CHECK LOGIN
// =========================

async function checkAuth() {

    const response =
        await fetch(
            ADMIN_PATH + "/auth"
        );

    const data =
        await response.json();


    if (data.loggedIn) {

        showDashboard();

    }

}



// =========================
// SHOW DASHBOARD
// =========================

function showDashboard() {

    document.getElementById(
        "loginScreen"
    ).style.display = "none";


    document.getElementById(
        "dashboard"
    ).style.display = "block";


    loadStats();

}



// =========================
// LOAD STATS
// =========================

async function loadStats() {

    try {

        const response =
            await fetch(
                ADMIN_PATH + "/stats"
            );


        if (response.status === 401) {

            location.reload();

            return;

        }


        const data =
            await response.json();


        document.getElementById(
            "onlineUsers"
        ).textContent =
            data.onlineUsers;


        document.getElementById(
            "waitingUsers"
        ).textContent =
            data.waitingUsers;


        document.getElementById(
            "activeChats"
        ).textContent =
            data.activeChats;


        updateUsers(
            data.users || []
        );

    }

    catch (error) {

        console.log(error);

    }

}



// =========================
// LIVE USER TABLE
// =========================
 function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
      }
function updateUsers(users) {

    const table =
        document.getElementById(
            "usersTable"
        );


    if (users.length === 0) {

        table.innerHTML = `

            <tr>

                <td colspan="4"
                    class="no-users">

                    No users connected

                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML = "";


    users.forEach(user => {

        const row =
            document.createElement("tr");


        let statusClass =
            "online";

        let statusText =
            "🔵 Online";


        if (user.status === "Waiting") {

            statusClass =
                "waiting";

            statusText =
                "🟡 Waiting";

        }


        if (user.status === "Chatting") {

            statusClass =
                "chatting";

            statusText =
                "🟢 Chatting";

        }


        const connectedSeconds =
            Math.floor(
                (Date.now() -
                user.connectedAt) / 1000
            );


        let connectedText;


        if (connectedSeconds < 60) {

            connectedText =
                connectedSeconds +
                " sec";

        }

        else {

            connectedText =
                Math.floor(
                    connectedSeconds / 60
                ) +
                " min";

        }


        row.innerHTML = `

            <td>
    <strong>${escapeHtml(user.nickname)}</strong>
    <br>
    <small>#${user.id}</small>
</td>

            <td class="${statusClass}">
                ${statusText}
            </td>

            <td>
                ${connectedText}
            </td>

            <td>

                <button
                    class="disconnect"
                    onclick="disconnectUser('${user.socketId}')">

                    🔴 Disconnect

                </button>

            </td>

        `;


        table.appendChild(row);

    });

}



// =========================
// DISCONNECT USER
// =========================

async function disconnectUser(socketId) {

    const confirmDisconnect =
        confirm(
            "Disconnect this user?"
        );


    if (!confirmDisconnect) {
        return;
    }


    const response =
        await fetch(
            ADMIN_PATH +
            "/disconnect",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    socketId
                })

            }
        );


    const data =
        await response.json();


    if (!data.success) {

        alert(
            data.error ||
            "Failed to disconnect user"
        );

        return;

    }


    loadStats();

}



// =========================
// LOGOUT
// =========================

async function logout() {

    await fetch(
        ADMIN_PATH + "/logout",
        {
            method: "POST"
        }
    );


    location.reload();

}



// =========================
// AUTO REFRESH
// =========================




// Start

checkAuth();

</script>


</body>

</html>
